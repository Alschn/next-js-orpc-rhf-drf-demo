[tool.poetry]
name = "next-js-orpc-rhf-drf-demo"
version = "0.1.0"
description = "DRF Backend"
authors = ["Alschn <67019937+Alschn@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.1.7"
djangorestframework = "^3.15.2"
djangorestframework-api-key = "^3.1.0"
djangorestframework-simplejwt = "^5.5.0"
drf-spectacular = "^0.28.0"
drf-standardized-errors = "^0.15.0"
django-cors-headers = "^4.7.0"
django-extensions = "^3.2.3"
django-filter = "^25.1"
environs = "^14.1.1"
django-storages = { extras = ["boto3"], version = "^1.14.5" }
psycopg = { extras = ["binary", "pool"], version = "^3.2.5" }
dj-database-url = "^2.3.0"
gunicorn = "^23.0.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.6.12"
freezegun = "^1.5.1"
ruff = "^0.9.9"
factory-boy = "^3.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
line-length = 120
lint.ignore = ["F401", "F403"]
