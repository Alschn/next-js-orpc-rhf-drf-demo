services:
  postgres-db:
    container_name: next-js-orpc-rhf-drf-demo-postgres-db
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    container_name: next-js-orpc-rhf-drf-demo-backend
    build: .
    volumes:
      - .:/app/
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    stdin_open: true
    tty: true
    env_file:
      - .env
    depends_on:
      - postgres-db
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres-data:
